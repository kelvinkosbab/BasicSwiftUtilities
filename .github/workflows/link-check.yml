name: Link Check

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - '.github/workflows/link-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.md'
  schedule:
    # Weekly Monday 06:00 UTC — catches link rot from the outside world.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: Check Markdown links
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Lychee link check
      uses: lycheeverse/lychee-action@v2
      with:
        # Check every .md file in the repo. --no-progress hides the per-link
        # spinner that's noisy in CI logs. --max-retries 2 cushions transient
        # network errors.
        args: >-
          --no-progress
          --max-retries 2
          --exclude-path .build
          --exclude-path .swiftpm
          './**/*.md'
        fail: true
