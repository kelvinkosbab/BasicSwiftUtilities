# SwiftLint configuration for BasicSwiftUtilities.
#
# Lives at the package root so the SPM build-tool plugin and any local
# `swiftlint` invocation pick it up automatically.
#
# Per the apple-linting-strategy rule:
#   - Tier 1 (correctness) rules are opt-in here — they're the highest-value
#     SwiftLint rules (force_unwrapping et al.).
#   - Per-rule thresholds are tuned for this codebase rather than disabling
#     rules wholesale.
#   - The CI workflow runs with --strict so warnings can't accumulate.

# MARK: - Scope

# Per-module layout: lint every {Module}/Sources and {Module}/Tests, skip
# build / cache / metadata directories.
included:
  - Core
  - CoreUI
  - CoreUIKit
  - CoreStorage
  - LocalNetworkMonitor
  - RunMode

excluded:
  - .build
  - .swiftpm
  - DerivedData
  # Preview-only files have a different style profile (long literal Color
  # arrays, copy-pasted SwiftUI scaffolding) — not worth fighting the linter
  # over them. The components they preview are linted.
  - "**/*Previews.swift"

# MARK: - Rules

# Rules ON by default that are noise for this project.
disabled_rules:
  - todo                          # the team uses GitHub issues / CHANGELOG, not source-level TODO comments
  - trailing_whitespace           # editor formatters handle this; flagging it on every save is noise

# Rules OFF by default — opt in for higher-value coverage. Per the rule,
# the opt-in set is where SwiftLint earns its keep. Keep this list growing
# over time as the codebase tolerates it.
opt_in_rules:
  - empty_count                   # `.isEmpty` over `.count == 0`
  - first_where                   # `.first(where:)` over `.filter {}.first`
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - explicit_init
  - redundant_nil_coalescing
  - closure_spacing
  - sorted_imports
  - private_outlet
  - overridden_super_call
  - convenience_type
  - empty_string
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - operator_usage_whitespace
  - prefer_zero_over_explicit_init
  - redundant_type_annotation
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

# Analyzer rules (require `swiftlint analyze` + a compiler log). Listed here
# for the day we wire up a `swiftlint analyze` CI step; they don't run via
# the build-tool plugin.
analyzer_rules:
  - unused_import
  - unused_declaration

# MARK: - Per-rule Configuration

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000

function_body_length:
  warning: 80
  error: 120

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length:
    warning: 1                    # Spacing.xl, .v6, etc. are intentional 2-char identifiers
  excluded:
    - id                          # Identifiable convention
    - x
    - y
    - z
    - to
    - of
    - i                           # loop index in fixture builders
    - a
    - b
