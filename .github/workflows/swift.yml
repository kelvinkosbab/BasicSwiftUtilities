name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

    - name: Show Swift version
      run: swift --version

    - name: Build
      run: swift build

    - name: Run tests with code coverage
      run: swift test --enable-code-coverage

    - name: Generate coverage report
      run: |
        BIN_PATH="$(swift build --show-bin-path)"
        XCTEST_PATH="$(find ${BIN_PATH} -name '*.xctest')"
        PROFDATA="${BIN_PATH}/codecov/default.profdata"

        # Collect Mach-O test binaries; skip .dSYM directories that share the dir.
        BINARIES=()
        for bin in "${XCTEST_PATH}"/Contents/MacOS/*; do
          if [ -f "${bin}" ]; then
            BINARIES+=("-object" "${bin}")
          fi
        done

        if [ ${#BINARIES[@]} -eq 0 ]; then
          echo "::error::No test binaries found at ${XCTEST_PATH}/Contents/MacOS"
          exit 1
        fi

        xcrun llvm-cov report \
          "${BINARIES[@]}" \
          -instr-profile "${PROFDATA}" \
          -ignore-filename-regex='Tests|.build' \
          | tee coverage-report.txt

        # The TOTAL row is the last line; line-coverage % is column 10.
        TOTAL=$(awk '/^TOTAL/ {print $10}' coverage-report.txt | tr -d '%')
        if [ -z "${TOTAL}" ]; then
          echo "::error::Could not parse total coverage from llvm-cov output"
          exit 1
        fi

        echo "Total line coverage: ${TOTAL}%"
        # 45% is a realistic floor for this utility library: ~half the codebase
        # is SwiftUI views (in CoreUI) that require snapshot or UI-test coverage
        # rather than unit tests. The gate exists to detect regressions, not to
        # mandate coverage of inherently hard-to-test view code.
        MIN_COVERAGE=45
        awk -v t="$TOTAL" -v m="$MIN_COVERAGE" 'BEGIN { exit (t+0 >= m+0 ? 0 : 1) }' || {
          echo "::error::Line coverage ${TOTAL}% is below the ${MIN_COVERAGE}% threshold."
          exit 1
        }

  build-ios:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

    - name: Build for iOS
      run: |
        xcodebuild build-for-testing \
          -scheme BasicSwiftUtilities \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
          -skipPackagePluginValidation \
          | tail -20

    - name: Test on iOS Simulator
      run: |
        xcodebuild test \
          -scheme BasicSwiftUtilities \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
          -skipPackagePluginValidation \
          | tail -40

  build-other-platforms:
    name: Build (${{ matrix.platform }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: tvOS
            destination: 'generic/platform=tvOS Simulator'
          - platform: watchOS
            destination: 'generic/platform=watchOS Simulator'
          - platform: visionOS
            destination: 'generic/platform=visionOS Simulator'

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

    - name: Build for ${{ matrix.platform }}
      run: |
        xcodebuild build \
          -scheme BasicSwiftUtilities \
          -destination '${{ matrix.destination }}' \
          -skipPackagePluginValidation \
          | tail -20
